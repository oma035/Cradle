<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up · Cradle</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="wrap">
    <nav class="top"><a class="logo" href="/"><img src="/static/logo.png" width="36" height="36" alt="" />Cradle</a></nav>
    <main class="narrow" style="margin: 30px auto 80px; text-align:center">
      <h1>Join Cradle</h1>
      <p class="hint">How will you use Cradle?</p>
      <div class="choice" style="text-align:left">
        <a class="bot-link" href="#">
          <div class="icon">🤰🏾</div>
          <h3>I'm a mother</h3>
          <p>Ask questions about your pregnancy or new baby on Telegram. We'll open the Cradle bot. Just tap <b>Start</b>.</p>
        </a>
        <a href="/signup/expert">
          <div class="icon">👩🏾‍⚕️</div>
          <h3>I'm an expert</h3>
          <p>Midwives, nurses and doctors: apply to review questions and get paid in USDC for every answer.</p>
        </a>
      </div>
    </main>
  </div>
  <script src="/static/site.js"></script>
</body>
</html>
